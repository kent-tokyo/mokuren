[package]
name = "mokuren"
version = "0.2.0"
edition = "2024"
description = "A fast, explainable symbolic composition engine for exploring music-theoretic decisions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/mokuren"
keywords = ["music-theory", "harmony", "composition", "explainable"]
categories = ["algorithms", "science"]
# demo/ and mokuren-acorde/ are independent crates (their own
# Cargo.toml, not workspace members) that depend on this one via a
# path — never bundle them into the published mokuren crate.
exclude = ["demo/", "mokuren-acorde/"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

[[bench]]
name = "harmonize"
harness = false
