[package]
name = "mokuren-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.104"
leptos = { version = "0.8.20", features = ["csr"] }
mokuren = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["Element"] }
